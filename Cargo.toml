[package]
name = "sandbox"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
include_dir = "0.7"
petname = "3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[lints.rust]
unused_must_use = "deny"

[lints.clippy]
expect_used = "deny"
panic = "deny"
redundant_clone = "warn"
unwrap_used = "deny"
