[package]
name = "sandbox"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29.0"
dirs = "6"
include_dir = "0.7"
lipsum = "0.9.1"
petname = "3"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tui-term = "0.3.4"

[lints.rust]
unused_must_use = "deny"

[lints.clippy]
expect_used = "deny"
panic = "deny"
redundant_clone = "warn"
unwrap_used = "deny"
